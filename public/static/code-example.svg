<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="code-title code-desc">
  <title id="code-title">Syntax highlighted code example</title>
  <desc id="code-desc">A visual placeholder showing a code editor with syntax highlighting and line numbers.</desc>
  <rect width="1200" height="630" fill="#f6f8fa"/>
  <rect x="64" y="64" width="1072" height="502" rx="32" fill="#ffffff" stroke="#d0d7de" stroke-width="4"/>

  <!-- Code editor frame -->
  <rect x="100" y="110" width="1000" height="380" rx="12" fill="#1e1e2e" stroke="#2d2d44" stroke-width="2"/>

  <!-- Title bar -->
  <rect x="100" y="110" width="1000" height="40" rx="12" fill="#181825"/>
  <rect x="100" y="138" width="1000" height="12" fill="#181825"/>
  <circle cx="124" cy="130" r="8" fill="#f38ba8"/>
  <circle cx="150" cy="130" r="8" fill="#fab387"/>
  <circle cx="176" cy="130" r="8" fill="#a6e3a1"/>
  <text x="600" y="134" fill="#cdd6f4" font-family="system-ui, monospace" font-size="15" text-anchor="middle">syntax-highlight.tsx</text>

  <!-- Line numbers + colored syntax lines -->
  <!-- Line 1 -->
  <text x="120" y="178" fill="#585b70" font-family="system-ui, monospace" font-size="17">1</text>
  <text x="148" y="178" fill="#cba6f7" font-family="system-ui, monospace" font-size="17" font-weight="700">import</text>
  <text x="216" y="178" fill="#cdd6f4" font-family="system-ui, monospace" font-size="17"> { useState } </text>
  <text x="352" y="178" fill="#cba6f7" font-family="system-ui, monospace" font-size="17" font-weight="700">from</text>
  <text x="396" y="178" fill="#a6e3a1" font-family="system-ui, monospace" font-size="17">"react"</text>

  <!-- Line 2 -->
  <text x="120" y="208" fill="#585b70" font-family="system-ui, monospace" font-size="17">2</text>

  <!-- Line 3 (highlighted) -->
  <rect x="100" y="215" width="1000" height="30" rx="4" fill="#313244" opacity="0.8"/>
  <text x="120" y="238" fill="#585b70" font-family="system-ui, monospace" font-size="17">3</text>
  <text x="148" y="238" fill="#cba6f7" font-family="system-ui, monospace" font-size="17" font-weight="700">export</text>
  <text x="210" y="238" fill="#cba6f7" font-family="system-ui, monospace" font-size="17" font-weight="700">function</text>
  <text x="292" y="238" fill="#89b4fa" font-family="system-ui, monospace" font-size="17">Counter</text>
  <text x="368" y="238" fill="#cdd6f4" font-family="system-ui, monospace" font-size="17">():</text>
  <text x="416" y="238" fill="#89b4fa" font-family="system-ui, monospace" font-size="17">ReactNode</text>
  <text x="504" y="238" fill="#cdd6f4" font-family="system-ui, monospace" font-size="17"> {</text>

  <!-- Line 4 -->
  <text x="120" y="268" fill="#585b70" font-family="system-ui, monospace" font-size="17">4</text>
  <text x="148" y="268" fill="#f9e2af" font-family="system-ui, monospace" font-size="17">  const</text>
  <text x="216" y="268" fill="#cdd6f4" font-family="system-ui, monospace" font-size="17"> [</text>
  <text x="228" y="268" fill="#89b4fa" font-family="system-ui, monospace" font-size="17">count</text>
  <text x="276" y="268" fill="#cdd6f4" font-family="system-ui, monospace" font-size="17">, </text>
  <text x="292" y="268" fill="#89b4fa" font-family="system-ui, monospace" font-size="17">setCount</text>
  <text x="376" y="268" fill="#cdd6f4" font-family="system-ui, monospace" font-size="17">] = </text>
  <text x="420" y="268" fill="#89b4fa" font-family="system-ui, monospace" font-size="17">useState</text>
  <text x="504" y="268" fill="#cdd6f4" font-family="system-ui, monospace" font-size="17">(</text>
  <text x="516" y="268" fill="#fab387" font-family="system-ui, monospace" font-size="17">0</text>
  <text x="528" y="268" fill="#cdd6f4" font-family="system-ui, monospace" font-size="17">)</text>

  <!-- Line 5 -->
  <text x="120" y="298" fill="#585b70" font-family="system-ui, monospace" font-size="17">5</text>

  <!-- Line 6 -->
  <text x="120" y="328" fill="#585b70" font-family="system-ui, monospace" font-size="17">6</text>
  <text x="148" y="328" fill="#cba6f7" font-family="system-ui, monospace" font-size="17" font-weight="700">  return</text>
  <text x="224" y="328" fill="#cdd6f4" font-family="system-ui, monospace" font-size="17"> (</text>

  <!-- Line 7 -->
  <text x="120" y="358" fill="#585b70" font-family="system-ui, monospace" font-size="17">7</text>
  <text x="148" y="358" fill="#89dceb" font-family="system-ui, monospace" font-size="17">    &lt;div</text>
  <text x="212" y="358" fill="#89b4fa" font-family="system-ui, monospace" font-size="17">className</text>
  <text x="304" y="358" fill="#a6e3a1" font-family="system-ui, monospace" font-size="17">="counter"</text>
  <text x="408" y="358" fill="#89dceb" font-family="system-ui, monospace" font-size="17">&gt;</text>

  <!-- Line 8 -->
  <text x="120" y="388" fill="#585b70" font-family="system-ui, monospace" font-size="17">8</text>
  <text x="148" y="388" fill="#89dceb" font-family="system-ui, monospace" font-size="17">      &lt;button</text>
  <text x="264" y="388" fill="#89b4fa" font-family="system-ui, monospace" font-size="17">onClick</text>
  <text x="340" y="388" fill="#a6e3a1" font-family="system-ui, monospace" font-size="17">={() =&gt; </text>
  <text x="424" y="388" fill="#89b4fa" font-family="system-ui, monospace" font-size="17">setCount</text>
  <text x="508" y="388" fill="#cdd6f4" font-family="system-ui, monospace" font-size="17">(</text>
  <text x="520" y="388" fill="#89b4fa" font-family="system-ui, monospace" font-size="17">c</text>
  <text x="540" y="388" fill="#cdd6f4" font-family="system-ui, monospace" font-size="17"> =&gt; </text>
  <text x="588" y="388" fill="#89b4fa" font-family="system-ui, monospace" font-size="17">c</text>
  <text x="600" y="388" fill="#cdd6f4" font-family="system-ui, monospace" font-size="17"> + </text>
  <text x="636" y="388" fill="#fab387" font-family="system-ui, monospace" font-size="17">1</text>
  <text x="648" y="388" fill="#cdd6f4" font-family="system-ui, monospace" font-size="17">)}</text>
  <text x="676" y="388" fill="#89dceb" font-family="system-ui, monospace" font-size="17">&gt;</text>

  <!-- Line 9 -->
  <text x="120" y="418" fill="#585b70" font-family="system-ui, monospace" font-size="17">9</text>
  <text x="148" y="418" fill="#cdd6f4" font-family="system-ui, monospace" font-size="17">        Count: {</text>
  <text x="268" y="418" fill="#89b4fa" font-family="system-ui, monospace" font-size="17">count</text>
  <text x="320" y="418" fill="#cdd6f4" font-family="system-ui, monospace" font-size="17">}</text>

  <!-- Line 10 -->
  <text x="120" y="448" fill="#585b70" font-family="system-ui, monospace" font-size="17">10</text>
  <text x="148" y="448" fill="#89dceb" font-family="system-ui, monospace" font-size="17">      &lt;/button&gt;</text>

  <!-- Diff hint at bottom -->
  <rect x="176" y="470" width="380" height="30" rx="8" fill="#f0f7f6" stroke="#b2dfdb" stroke-width="1.5"/>
  <text x="196" y="490" fill="#00796b" font-family="system-ui, monospace" font-size="16">```ts title="counter.tsx" hl_lines="3"```</text>

  <!-- Highlight bar on left side of line 3 -->
  <rect x="100" y="215" width="5" height="30" rx="2" fill="#f9e2af"/>

  <text x="600" y="534" fill="#57606a" font-family="system-ui, sans-serif" font-size="40" text-anchor="middle">Syntax Highlighting</text>
</svg>
