<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="toc-title toc-desc">
  <title id="toc-title">Table of Contents example</title>
  <desc id="toc-desc">A visual placeholder showing a document outline with hierarchical TOC entries.</desc>
  <rect width="1200" height="630" fill="#f6f8fa"/>
  <rect x="64" y="64" width="1072" height="502" rx="32" fill="#ffffff" stroke="#d0d7de" stroke-width="4"/>

  <!-- Sidebar TOC panel -->
  <rect x="100" y="120" width="260" height="400" rx="16" fill="#f0f7f6" stroke="#b2dfdb" stroke-width="2"/>
  <text x="120" y="158" fill="#00796b" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Contents</text>
  <line x1="120" y1="172" x2="340" y2="172" stroke="#b2dfdb" stroke-width="2"/>

  <!-- TOC entries -->
  <rect x="120" y="194" width="4" height="14" rx="2" fill="#80cbc4"/>
  <rect x="134" y="194" width="176" height="6" rx="3" fill="#80cbc4"/>
  <rect x="134" y="206" width="120" height="6" rx="3" fill="#e0f2f1"/>

  <rect x="140" y="236" width="4" height="14" rx="2" fill="#d0d7de"/>
  <rect x="154" y="236" width="156" height="6" rx="3" fill="#d0d7de"/>
  <rect x="154" y="248" width="100" height="6" rx="3" fill="#e5e8eb"/>

  <rect x="140" y="276" width="4" height="14" rx="2" fill="#d0d7de"/>
  <rect x="154" y="276" width="168" height="6" rx="3" fill="#d0d7de"/>
  <rect x="154" y="288" width="130" height="6" rx="3" fill="#e5e8eb"/>

  <rect x="120" y="316" width="4" height="14" rx="2" fill="#80cbc4"/>
  <rect x="134" y="316" width="190" height="6" rx="3" fill="#80cbc4"/>
  <rect x="134" y="328" width="140" height="6" rx="3" fill="#e0f2f1"/>

  <rect x="140" y="356" width="4" height="14" rx="2" fill="#d0d7de"/>
  <rect x="154" y="356" width="148" height="6" rx="3" fill="#d0d7de"/>

  <rect x="120" y="396" width="4" height="14" rx="2" fill="#d0d7de"/>
  <rect x="134" y="396" width="160" height="6" rx="3" fill="#d0d7de"/>

  <!-- Document content area -->
  <rect x="400" y="148" width="680" height="16" rx="4" fill="#0969da" opacity="0.85"/>
  <rect x="400" y="186" width="640" height="8" rx="3" fill="#57606a" opacity="0.6"/>
  <rect x="400" y="204" width="600" height="8" rx="3" fill="#57606a" opacity="0.4"/>
  <rect x="400" y="222" width="660" height="8" rx="3" fill="#57606a" opacity="0.35"/>
  <rect x="400" y="240" width="580" height="8" rx="3" fill="#57606a" opacity="0.3"/>

  <rect x="400" y="280" width="380" height="13" rx="4" fill="#0969da" opacity="0.7"/>
  <rect x="400" y="312" width="620" height="8" rx="3" fill="#57606a" opacity="0.5"/>
  <rect x="400" y="330" width="650" height="8" rx="3" fill="#57606a" opacity="0.35"/>
  <rect x="400" y="348" width="560" height="8" rx="3" fill="#57606a" opacity="0.3"/>

  <rect x="400" y="396" width="420" height="13" rx="4" fill="#0969da" opacity="0.7"/>
  <rect x="400" y="426" width="610" height="8" rx="3" fill="#57606a" opacity="0.5"/>
  <rect x="400" y="444" width="590" height="8" rx="3" fill="#57606a" opacity="0.35"/>

  <!-- Scroll-spy indicator -->
  <rect x="84" y="194" width="5" height="130" rx="3" fill="#00796b"/>

  <text x="600" y="530" fill="#57606a" font-family="system-ui, sans-serif" font-size="40" text-anchor="middle">Table of Contents</text>
</svg>
