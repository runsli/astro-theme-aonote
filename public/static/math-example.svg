<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="math-title math-desc">
  <title id="math-title">MathML equation examples</title>
  <desc id="math-desc">A visual placeholder showing mathematical equations including integrals, sums, and matrices.</desc>
  <rect width="1200" height="630" fill="#f6f8fa"/>
  <rect x="64" y="64" width="1072" height="502" rx="32" fill="#ffffff" stroke="#d0d7de" stroke-width="4"/>

  <!-- Math equations rendered as SVG shapes -->

  <!-- E = mc² -->
  <text x="180" y="210" fill="#0969da" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-style="italic">E</text>
  <text x="230" y="210" fill="#57606a" font-family="system-ui, sans-serif" font-size="62">=</text>
  <text x="290" y="210" fill="#0969da" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-style="italic">mc</text>
  <text x="370" y="190" fill="#0969da" font-family="Georgia, 'Times New Roman', serif" font-size="38">2</text>

  <!-- Integral: ∫₀¹ x² dx = ⅓ -->
  <text x="180" y="310" fill="#57606a" font-family="Georgia, 'Times New Roman', serif" font-size="72">∫</text>
  <text x="214" y="340" fill="#57606a" font-family="system-ui, sans-serif" font-size="24">0</text>
  <text x="228" y="278" fill="#57606a" font-family="system-ui, sans-serif" font-size="24">1</text>
  <text x="245" y="310" fill="#0969da" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-style="italic">x</text>
  <text x="272" y="295" fill="#0969da" font-family="Georgia, 'Times New Roman', serif" font-size="30">2</text>
  <text x="300" y="310" fill="#0969da" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-style="italic">dx</text>
  <text x="355" y="310" fill="#57606a" font-family="system-ui, sans-serif" font-size="52">=</text>
  <!-- 1/3 fraction -->
  <text x="430" y="310" fill="#80cbc4" font-family="Georgia, 'Times New Roman', serif" font-size="44">1</text>
  <line x1="415" y1="318" x2="465" y2="318" stroke="#80cbc4" stroke-width="2"/>
  <text x="430" y="348" fill="#80cbc4" font-family="Georgia, 'Times New Roman', serif" font-size="44">3</text>

  <!-- Summation: Σ(n=1→∞) 1/n² = π²/6 -->
  <text x="560" y="250" fill="#57606a" font-family="Georgia, 'Times New Roman', serif" font-size="60">∑</text>
  <text x="600" y="276" fill="#57606a" font-family="system-ui, sans-serif" font-size="22">n=1</text>
  <text x="642" y="250" fill="#0969da" font-family="Georgia, 'Times New Roman', serif" font-size="44">1</text>
  <line x1="638" y1="258" x2="670" y2="258" stroke="#0969da" stroke-width="2"/>
  <text x="640" y="288" fill="#0969da" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-style="italic">n</text>
  <text x="662" y="276" fill="#0969da" font-family="Georgia, 'Times New Roman', serif" font-size="22">2</text>
  <text x="695" y="250" fill="#57606a" font-family="system-ui, sans-serif" font-size="52">=</text>
  <!-- π²/6 -->
  <text x="770" y="232" fill="#80cbc4" font-family="Georgia, 'Times New Roman', serif" font-size="40">π</text>
  <text x="810" y="220" fill="#80cbc4" font-family="Georgia, 'Times New Roman', serif" font-size="26">2</text>
  <line x1="760" y1="252" x2="850" y2="252" stroke="#80cbc4" stroke-width="2"/>
  <text x="800" y="290" fill="#80cbc4" font-family="Georgia, 'Times New Roman', serif" font-size="44">6</text>

  <!-- Matrix -->
  <text x="950" y="210" fill="#57606a" font-family="system-ui, sans-serif" font-size="40">[</text>
  <text x="972" y="190" fill="#0969da" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-style="italic">a</text>
  <text x="1012" y="190" fill="#0969da" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-style="italic">b</text>
  <text x="972" y="234" fill="#0969da" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-style="italic">c</text>
  <text x="1012" y="234" fill="#0969da" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-style="italic">d</text>
  <text x="1048" y="210" fill="#57606a" font-family="system-ui, sans-serif" font-size="40">]</text>

  <!-- Quadratic formula -->
  <text x="560" y="390" fill="#0969da" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-style="italic">x</text>
  <text x="588" y="390" fill="#57606a" font-family="system-ui, sans-serif" font-size="38">=</text>
  <!-- fraction -->
  <text x="640" y="374" fill="#80cbc4" font-family="system-ui, sans-serif" font-size="30">−b ±</text>
  <text x="740" y="370" fill="#57606a" font-family="Georgia, 'Times New Roman', serif" font-size="32">√</text>
  <line x1="768" y1="370" x2="868" y2="370" stroke="#57606a" stroke-width="2"/>
  <text x="778" y="364" fill="#80cbc4" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-style="italic">b</text>
  <text x="802" y="350" fill="#80cbc4" font-family="Georgia, 'Times New Roman', serif" font-size="20">2</text>
  <text x="822" y="364" fill="#57606a" font-family="system-ui, sans-serif" font-size="28">− 4</text>
  <text x="860" y="364" fill="#80cbc4" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-style="italic">ac</text>
  <line x1="620" y1="398" x2="900" y2="398" stroke="#80cbc4" stroke-width="2"/>
  <text x="740" y="436" fill="#80cbc4" font-family="system-ui, sans-serif" font-size="30">2</text>
  <text x="758" y="436" fill="#80cbc4" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-style="italic">a</text>

  <!-- Inline math hint -->
  <rect x="176" y="460" width="580" height="36" rx="8" fill="#f0f7f6" stroke="#b2dfdb" stroke-width="1.5"/>
  <text x="196" y="484" fill="#00796b" font-family="system-ui, monospace" font-size="20">$E=mc^2$ and $$\int_0^1 x^2 dx = \frac{1}{3}$$</text>

  <text x="600" y="534" fill="#57606a" font-family="system-ui, sans-serif" font-size="40" text-anchor="middle">MathML Rendering</text>
</svg>
